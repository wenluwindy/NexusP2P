# coturn 配置 —— NexusP2P 中继
#
# 部署前必须改的只有三处，都用 ★ 标出。
# 完整说明见 deploy/README.md。

# ── 监听 ────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ★ 改成你的公网 IP。动态 IP 就配 DDNS 后用脚本定期更新这一行。
# 不填的话 coturn 会自己探测，但在 NAT 后面往往探测错，
# 结果是中继候选带着内网地址下发出去 —— 对端永远连不上。
external-ip=YOUR_PUBLIC_IP

# 中继用的 UDP 端口段。路由器上要把这一段转发进来。
# 范围越小并发越少：一次传输占 2~4 个端口，1000 个够几百路并发。
min-port=49160
max-port=50160

# ── 鉴权：时限凭据 ──────────────────────────────────────
#
# 用 use-auth-secret 而不是固定账号密码。
# 分享链接是公开传播的，而两端都要拿到 TURN 凭据 ——
# 固定密码一旦泄露，任何人都能白嫖你家的中继带宽，
# 而且改密码要重启服务、所有在传的都断。
use-auth-secret

# ★ 与信令服务器的 Signaling:Turn:Secret 必须完全一致。
# 两边不一致的现象是「中继配了却永远连不上」，且没有任何有用的报错。
# 生成一个：  openssl rand -hex 32
static-auth-secret=YOUR_SHARED_SECRET

# ★ 改成你的域名。凭据的 realm 必须与客户端使用的一致。
realm=YOUR_DOMAIN

# ── TLS ────────────────────────────────────────────────
# 复用信令服务器那张 Let's Encrypt 证书（DNS-01 签发）。
# turns:（5349）在一些封锁 UDP 的网络里是唯一能通的路径。
cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# ── 收紧 ────────────────────────────────────────────────
# 只做中继，不做别的
no-cli
no-multicast-peers

# 禁止中继到内网地址。不加这条，任何知道凭据的人都能拿你的服务器
# 当跳板去扫内网 —— 这是 TURN 服务器最常见的被滥用方式。
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# 单个会话的带宽上限（字节/秒）。0 表示不限。
#
# 按已决问题「中继不限速」，这里保持 0。
# 之所以留着这一行，是因为它是唯一能在滥用发生时立刻止血的开关。
user-quota=0
total-quota=0

# ── 日志 ────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
simple-log
