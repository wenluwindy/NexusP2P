# nginx 反向代理到信令服务器。
#
# 适用于「443 已经被现有网站占着」的情况 —— 直接给 NexusP2P 一个子域名，
# 证书和 443 都复用现有的那一套。
#
# 放到 /etc/nginx/sites-available/ 下并软链到 sites-enabled/，
# 或者直接扔进 /etc/nginx/conf.d/。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name p2p.你的域名;

    ssl_certificate     /etc/letsencrypt/live/p2p.你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p2p.你的域名/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # ── WebSocket 升级：少了这两行信令完全不通 ──────────────
        # 现象是「建房就失败」，而 HTTP 的 /health 一切正常 ——
        # 于是很容易误判成程序的问题。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ── 入房限速要靠这个头 ──────────────────────────────
        # 服务端那边必须同时把 Signaling:BehindReverseProxy 设为 true，
        # 否则它看到的来源 IP 全是 127.0.0.1，所有人共用一个配额。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 超时：信令连接要活到整场传输结束 ──────────────────
        # nginx 默认 60 秒无数据就断。信令在传输开始后基本是静默的
        # （ICE 偶尔补一条候选），60 秒必然被掐 —— 而掐掉之后
        # 房间进入宽限期、自动重连的落点也就没了。
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;

        # 信令是小消息 + 低延迟，缓冲只会添乱
        proxy_buffering off;
    }
}
